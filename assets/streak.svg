<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 238" width="820" height="238" role="img" aria-label="Commit streaks / Rachas de commits">
<title>Commit streaks / Rachas de commits</title>
<style>
  .f { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .label { font-size: 13px; letter-spacing: 0.8px; }
  .value { font-size: 34px; font-weight: 700; }
  .head  { font-size: 14px; letter-spacing: 1.6px; fill: #8a8a8a; }
</style>
<rect x="0.5" y="0.5" width="819" height="237" rx="12" fill="#0b0b0b" stroke="#232323"/>
<defs>
  <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%"   stop-color="#8c0200"/>
    <stop offset="45%"  stop-color="#e10600"/>
    <stop offset="100%" stop-color="#ff5a3c"/>
  </linearGradient>
  <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%"   stop-color="#2a2a2a"/>
    <stop offset="100%" stop-color="#565656"/>
  </linearGradient>
  <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%"   stop-color="#e10600" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#e10600" stop-opacity="0"/>
  </radialGradient>
</defs>
  <text class="f head" x="24" y="32">STREAKS · LAST YEAR<tspan fill="#4a4a4a">  /  RACHAS · ÚLTIMO AÑO</tspan></text>
  <line x1="24" y1="46" x2="796" y2="46" stroke="#232323"/>
  
  <ellipse cx="158" cy="128" rx="120" ry="84" fill="url(#ember)"/>
  <g transform="translate(110 68) scale(0.96 0.98)">
    <g transform="translate(50 120)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.04 0.96; 0.97 1.05; 1.02 0.99; 1 1"
          keyTimes="0;0.25;0.5;0.75;1" dur="2.6s" repeatCount="indefinite"/>
        <g transform="translate(-50 -120)">
          <path d="M50,120 C20,110 8,86 16,60 C22,42 38,32 42,14 C44,6 43,2 40,0 C70,10 84,36 84,60 C84,90 70,111 50,120 Z" fill="url(#flame)"/>
          <path d="M50,120 C36,113 29,97 35,81 C39,69 50,60 52,47 C55,58 63,67 66,79 C70,97 62,113 50,120 Z" fill="#6d0200" opacity="0.85"/>
        </g>
      </g>
    </g>
  </g>
  <text class="f" x="158" y="148" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff">5</text>
  <text class="f label" x="158" y="172" text-anchor="middle" fill="#ffd9d4">DAYS · DÍAS</text>
  <text class="f label" x="158" y="204" text-anchor="middle" fill="#8a8a8a">CURRENT STREAK · RACHA ACTUAL</text>
  <text class="f" x="158" y="222" text-anchor="middle" font-size="11" fill="#4a4a4a">Aug 27 – Aug 31</text>
  <line x1="292" y1="62" x2="292" y2="214" stroke="#232323"/><g opacity="0">
      <text class="f value" x="380" y="126" text-anchor="middle" fill="#ffffff">11</text>
      <text class="f label" x="380" y="154" text-anchor="middle" fill="#8a8a8a">LONGEST STREAK</text>
      <text class="f label" x="380" y="172" text-anchor="middle" fill="#4a4a4a">RACHA MÁS LARGA</text>
      <text class="f" x="380" y="196" text-anchor="middle" font-size="11" fill="#4a4a4a">Oct 23 – Nov 2</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.5s" fill="freeze"/>
    </g><line x1="468" y1="86" x2="468" y2="196" stroke="#232323"/><g opacity="0">
      <text class="f value" x="556" y="126" text-anchor="middle" fill="#ffffff">75</text>
      <text class="f label" x="556" y="154" text-anchor="middle" fill="#8a8a8a">ACTIVE DAYS</text>
      <text class="f label" x="556" y="172" text-anchor="middle" fill="#4a4a4a">DÍAS ACTIVOS</text>
      <text class="f" x="556" y="196" text-anchor="middle" font-size="11" fill="#4a4a4a">of 367 · de 367</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.10s" dur="0.5s" fill="freeze"/>
    </g><line x1="644" y1="86" x2="644" y2="196" stroke="#232323"/><g opacity="0">
      <text class="f value" x="732" y="126" text-anchor="middle" fill="#ffffff">55</text>
      <text class="f label" x="732" y="154" text-anchor="middle" fill="#8a8a8a">BEST DAY</text>
      <text class="f label" x="732" y="172" text-anchor="middle" fill="#4a4a4a">MEJOR DÍA</text>
      <text class="f" x="732" y="196" text-anchor="middle" font-size="11" fill="#4a4a4a">Aug 29</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.5s" fill="freeze"/>
    </g>
</svg>
