<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 176" width="820" height="176" role="img" aria-label="Commit streaks / Rachas de commits">
<title>Commit streaks / Rachas de commits</title>
<style>
  .f { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .label { font-size: 13px; letter-spacing: 0.8px; }
  .value { font-size: 34px; font-weight: 700; }
  .head  { font-size: 14px; letter-spacing: 1.6px; fill: #8a8a8a; }
</style>
<rect x="0.5" y="0.5" width="819" height="175" rx="12" fill="#0b0b0b" stroke="#232323"/>

  <text class="f head" x="24" y="32">STREAKS · LAST YEAR<tspan fill="#4a4a4a">  /  RACHAS · ÚLTIMO AÑO</tspan></text>
  <line x1="24" y1="46" x2="796" y2="46" stroke="#232323"/>
  <g opacity="0">
      <text class="f value" x="120.5" y="98" text-anchor="middle" fill="#e10600">5</text>
      <text class="f label" x="120.5" y="124" text-anchor="middle" fill="#8a8a8a">CURRENT STREAK</text>
      <text class="f label" x="120.5" y="142" text-anchor="middle" fill="#4a4a4a">RACHA ACTUAL</text>
      <text class="f" x="120.5" y="162" text-anchor="middle" font-size="11" fill="#4a4a4a">Aug 27 – Aug 31</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.5s" fill="freeze"/>
    </g><line x1="217" y1="66" x2="217" y2="156" stroke="#232323"/><g opacity="0">
      <text class="f value" x="313.5" y="98" text-anchor="middle" fill="#ffffff">11</text>
      <text class="f label" x="313.5" y="124" text-anchor="middle" fill="#8a8a8a">LONGEST STREAK</text>
      <text class="f label" x="313.5" y="142" text-anchor="middle" fill="#4a4a4a">RACHA MÁS LARGA</text>
      <text class="f" x="313.5" y="162" text-anchor="middle" font-size="11" fill="#4a4a4a">Oct 23 – Nov 2</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.08s" dur="0.5s" fill="freeze"/>
    </g><line x1="410" y1="66" x2="410" y2="156" stroke="#232323"/><g opacity="0">
      <text class="f value" x="506.5" y="98" text-anchor="middle" fill="#ffffff">72</text>
      <text class="f label" x="506.5" y="124" text-anchor="middle" fill="#8a8a8a">ACTIVE DAYS</text>
      <text class="f label" x="506.5" y="142" text-anchor="middle" fill="#4a4a4a">DÍAS ACTIVOS</text>
      <text class="f" x="506.5" y="162" text-anchor="middle" font-size="11" fill="#4a4a4a">of 366 · de 366</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.16s" dur="0.5s" fill="freeze"/>
    </g><line x1="603" y1="66" x2="603" y2="156" stroke="#232323"/><g opacity="0">
      <text class="f value" x="699.5" y="98" text-anchor="middle" fill="#ffffff">55</text>
      <text class="f label" x="699.5" y="124" text-anchor="middle" fill="#8a8a8a">BEST DAY</text>
      <text class="f label" x="699.5" y="142" text-anchor="middle" fill="#4a4a4a">MEJOR DÍA</text>
      <text class="f" x="699.5" y="162" text-anchor="middle" font-size="11" fill="#4a4a4a">Aug 29</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/>
    </g>
</svg>
