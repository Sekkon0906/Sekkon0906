<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 163" width="900" height="163" role="img" aria-label="AI and automation stack: CLAUDE, CLAUDE CODE, CODEX, N8N, OBSIDIAN, OPENCLAW">
