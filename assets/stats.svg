<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" height="150" role="img" aria-label="GitHub overview / Resumen de GitHub">
<title>GitHub overview / Resumen de GitHub</title>
<style>
  .f { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .label { font-size: 10px; letter-spacing: 1.8px; fill: #8a8a8a; }
  .value { font-size: 26px; font-weight: 700; fill: #ffffff; }
  .head  { font-size: 11px; letter-spacing: 2.6px; fill: #8a8a8a; }
</style>
<rect x="0.5" y="0.5" width="819" height="149" rx="12" fill="#0b0b0b" stroke="#232323"/>

  <text class="f head" x="24" y="32">OVERVIEW<tspan fill="#4a4a4a">  /  RESUMEN</tspan></text>
  <line x1="24" y1="46" x2="796" y2="46" stroke="#232323"/>
  <g opacity="0">
      <text class="f value" x="88.33333333333333" y="90" text-anchor="middle" fill="#e10600">548</text>
      <text class="f label" x="88.33333333333333" y="110" text-anchor="middle">CONTRIBUTIONS</text>
      <text class="f label" x="88.33333333333333" y="126" text-anchor="middle" fill="#4a4a4a">CONTRIBUCIONES</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.5s" fill="freeze"/>
    </g><line x1="152.66666666666666" y1="62" x2="152.66666666666666" y2="130" stroke="#232323"/><g opacity="0">
      <text class="f value" x="217" y="90" text-anchor="middle" fill="#ffffff">511</text>
      <text class="f label" x="217" y="110" text-anchor="middle">COMMITS</text>
      <text class="f label" x="217" y="126" text-anchor="middle" fill="#4a4a4a">COMMITS</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.08s" dur="0.5s" fill="freeze"/>
    </g><line x1="281.3333333333333" y1="62" x2="281.3333333333333" y2="130" stroke="#232323"/><g opacity="0">
      <text class="f value" x="345.66666666666663" y="90" text-anchor="middle" fill="#ffffff">21</text>
      <text class="f label" x="345.66666666666663" y="110" text-anchor="middle">PULL REQUESTS</text>
      <text class="f label" x="345.66666666666663" y="126" text-anchor="middle" fill="#4a4a4a">PULL REQUESTS</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.16s" dur="0.5s" fill="freeze"/>
    </g><line x1="410" y1="62" x2="410" y2="130" stroke="#232323"/><g opacity="0">
      <text class="f value" x="474.3333333333333" y="90" text-anchor="middle" fill="#ffffff">15</text>
      <text class="f label" x="474.3333333333333" y="110" text-anchor="middle">REPOSITORIES</text>
      <text class="f label" x="474.3333333333333" y="126" text-anchor="middle" fill="#4a4a4a">REPOSITORIOS</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/>
    </g><line x1="538.6666666666666" y1="62" x2="538.6666666666666" y2="130" stroke="#232323"/><g opacity="0">
      <text class="f value" x="603" y="90" text-anchor="middle" fill="#ffffff">2</text>
      <text class="f label" x="603" y="110" text-anchor="middle">STARS EARNED</text>
      <text class="f label" x="603" y="126" text-anchor="middle" fill="#4a4a4a">ESTRELLAS</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.32s" dur="0.5s" fill="freeze"/>
    </g><line x1="667.3333333333333" y1="62" x2="667.3333333333333" y2="130" stroke="#232323"/><g opacity="0">
      <text class="f value" x="731.6666666666666" y="90" text-anchor="middle" fill="#ffffff">1</text>
      <text class="f label" x="731.6666666666666" y="110" text-anchor="middle">FOLLOWERS</text>
      <text class="f label" x="731.6666666666666" y="126" text-anchor="middle" fill="#4a4a4a">SEGUIDORES</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.5s" fill="freeze"/>
    </g>
</svg>
