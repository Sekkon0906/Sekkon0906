name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch: # manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Same black / white / red ramp the generated cards use, so the
          # snake reads as part of the profile instead of a bolted-on widget.
          outputs: |
            dist/github-snake.svg?color_snake=%23e10600&color_dots=%23ebedf0,%234d4d4d,%23b3b3b3,%23ffffff,%23e10600
            dist/github-snake-dark.svg?color_snake=%23e10600&color_dots=%23161616,%234d4d4d,%23b3b3b3,%23ffffff,%23e10600

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
